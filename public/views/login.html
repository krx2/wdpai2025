<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Screen</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="container">
        <h1 class="title">Zaloguj się do systemu</h1>
        
        <form class="login-form" method="POST" action="login_process.php">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Value" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Value" required>
            </div>
            
            <button type="submit" class="btn-signin">Sign in</button>
            
            <a href="forgot-password.php" class="forgot-link">Forgot password?</a>
        </form>
    </div>
</body>
</html>
