<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Screen</title>
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <div class="dashboard">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <div class="logo">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <rect width="10" height="10" fill="currentColor"/>
                        <rect x="14" width="10" height="10" fill="currentColor"/>
                        <rect y="14" width="10" height="10" fill="currentColor"/>
                        <rect x="14" y="14" width="10" height="10" fill="currentColor"/>
                    </svg>
                </div>
            </div>
            <nav class="nav">
                <a href="#" class="nav-link">Projekty</a>
                <a href="#" class="nav-link">Raport</a>
                <a href="#" class="nav-link">Statystyki</a>
            </nav>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <div class="user-header">
                <h1 class="user-title">Witaj User!</h1>
                <p class="user-subtitle">Twoje projekty</p>
            </div>

            <div class="projects-grid">
                <!-- Projekt 1 -->
                <div class="project-card">
                    <img src="https://images.unsplash.com/photo-1555854877-bab0e564b8d5?w=400&h=300&fit=crop" 
                         alt="Długa 14" 
                         class="project-image">
                    <div class="project-info">
                        <h3 class="project-title">Długa 14</h3>
                        <p class="project-date">Projekt wykonany na 29.20.2025</p>
                        <button class="btn-manage">Zarządzaj</button>
                    </div>
                </div>

                <!-- Projekt 2 -->
                <div class="project-card">
                    <img src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=400&h=300&fit=crop" 
                         alt="Szeroka 21" 
                         class="project-image">
                    <div class="project-info">
                        <h3 class="project-title">Szeroka 21</h3>
                        <p class="project-date">Projekt techniczny na 31.11.2025</p>
                        <button class="btn-manage">Zarządzaj</button>
                    </div>
                </div>

                <!-- Projekt 3 -->
                <div class="project-card">
                    <img src="https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?w=400&h=300&fit=crop" 
                         alt="Osiedle Dąbie" 
                         class="project-image">
                    <div class="project-info">
                        <h3 class="project-title">Osiedle Dąbie</h3>
                        <p class="project-date">Oddane 10.09.2025</p>
                        <button class="btn-manage">Zarządzaj</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
